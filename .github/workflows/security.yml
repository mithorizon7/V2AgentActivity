name: Security checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.15@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
        env:
          POSTGRES_DB: learning_test
          POSTGRES_USER: learning_test
          POSTGRES_PASSWORD: isolated_ci_only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U learning_test -d learning_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-runtime.mjs
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build
      - run: npm run test:security
      # Prepare only the isolated CI database. Production schema is promoted by Publish.
      - run: npm run db:push
        env:
          DATABASE_URL: postgresql://learning_test:isolated_ci_only@localhost:5432/learning_test
      - run: npm run test:postgres
        env:
          DATABASE_TEST_URL: postgresql://learning_test:isolated_ci_only@localhost:5432/learning_test
      - run: npm audit --omit=dev --audit-level=low
